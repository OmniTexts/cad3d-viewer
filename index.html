<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b1a" />
    <meta name="description" content="在浏览器本地查看 CAD3D 生成的 GLB 三维模型。" />
    <title>CAD3D Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">C3</span>
          <div class="brand-copy">
            <strong>CAD3D Viewer</strong>
            <span id="file-name">三维评审</span>
          </div>
        </div>

        <div class="header-context">
          <select id="region-select" class="region-select is-hidden" aria-label="展示区域"></select>
        </div>

        <div class="header-actions">
          <label class="command-button" for="file-input" role="button" tabindex="0">
            <i data-lucide="folder-open"></i><span>打开 GLB</span>
          </label>
          <button type="button" class="icon-button" id="fit-view" aria-label="适应视图" data-tooltip="适应视图" disabled>
            <i data-lucide="scan"></i>
          </button>
          <button type="button" class="icon-button" id="top-view" aria-label="俯视图" data-tooltip="俯视图" disabled>
            <i data-lucide="map"></i>
          </button>
          <button type="button" class="icon-button" id="capture-view" aria-label="保存视图" data-tooltip="保存视图" disabled>
            <i data-lucide="camera"></i>
          </button>
          <button type="button" class="icon-button" id="fullscreen-view" aria-label="全屏" data-tooltip="全屏">
            <i data-lucide="maximize-2"></i>
          </button>
          <button type="button" class="icon-button" id="toggle-info" aria-label="显示模型信息" aria-controls="info-panel" aria-expanded="false" data-tooltip="模型信息" disabled>
            <i data-lucide="panel-right"></i>
          </button>
        </div>
        <input id="file-input" class="file-input-native" type="file" accept=".glb,model/gltf-binary" />
      </header>

      <main id="viewer" aria-label="GLB 三维模型浏览器">
        <canvas id="scene-canvas"></canvas>

        <section class="empty-state" id="empty-state">
          <div class="drop-zone" id="drop-zone">
            <span class="upload-symbol" aria-hidden="true"><i data-lucide="box"></i></span>
            <p class="eyebrow">CAD3D MODEL OUTPUT</p>
            <h1>打开三维模型</h1>
            <label class="primary-button" for="file-input" role="button" tabindex="0">
              <i data-lucide="folder-open"></i><span>选择 GLB 文件</span>
            </label>
            <small>GLB · 本地读取</small>
          </div>
        </section>

        <div class="drop-overlay is-hidden" id="drop-overlay" aria-hidden="true">
          <i data-lucide="file-up"></i><strong>释放以查看模型</strong>
        </div>

        <div class="loading-state is-hidden" id="loading-state" role="status" aria-live="polite">
          <span class="loading-orbit" aria-hidden="true"></span>
          <strong id="loading-title">正在载入模型</strong>
          <span id="loading-detail">读取本地 GLB</span>
        </div>

        <div class="error-state is-hidden" id="error-state" role="alert">
          <i data-lucide="circle-alert"></i>
          <strong>无法显示这个模型</strong>
          <p id="error-message"></p>
          <label class="secondary-button" for="file-input" role="button" tabindex="0">选择其它 GLB</label>
        </div>

        <div class="scene-badge is-hidden" id="scene-badge">
          <span class="live-dot"></span>
          <div><strong id="scene-title">模型已就绪</strong><span id="scene-meta">--</span></div>
        </div>

        <div class="view-controls is-hidden" id="view-controls" aria-label="显示设置">
          <label class="environment-control">
            <i data-lucide="sun"></i>
            <select id="environment-select" aria-label="环境光照">
              <option value="daylight">日光</option>
              <option value="studio">摄影棚</option>
              <option value="dusk">暮色</option>
            </select>
          </label>
          <span class="control-divider"></span>
          <button type="button" class="control-button is-active" id="toggle-ground" aria-pressed="true" data-tooltip="地面与网格">
            <i data-lucide="grid-3x3"></i>
          </button>
          <button type="button" class="control-button is-active" id="toggle-shadows" aria-pressed="true" data-tooltip="软阴影">
            <i data-lucide="cloud-sun"></i>
          </button>
          <button type="button" class="control-button is-active" id="toggle-ao" aria-pressed="true" data-tooltip="环境遮蔽">
            <i data-lucide="contrast"></i>
          </button>
          <button type="button" class="control-button" id="toggle-rotate" aria-pressed="false" data-tooltip="自动旋转">
            <i data-lucide="rotate-3d"></i>
          </button>
        </div>

        <aside class="info-panel" id="info-panel" aria-labelledby="info-title">
          <div class="panel-header">
            <div>
              <span class="eyebrow">MODEL REVIEW</span>
              <h2 id="info-title">模型信息</h2>
            </div>
            <button type="button" class="icon-button" id="close-info" aria-label="关闭模型信息">
              <i data-lucide="x"></i>
            </button>
          </div>

          <div class="model-status">
            <span class="status-icon"><i data-lucide="badge-check"></i></span>
            <div><strong>GLB 已载入</strong><span id="model-format">glTF 2.0</span></div>
          </div>

          <dl class="stat-grid">
            <div><dt>构件</dt><dd id="stat-objects">--</dd></div>
            <div><dt>三角面</dt><dd id="stat-triangles">--</dd></div>
            <div><dt>材质</dt><dd id="stat-materials">--</dd></div>
            <div><dt>区域</dt><dd id="stat-regions">--</dd></div>
          </dl>

          <section class="panel-section">
            <div class="section-heading"><h3>模型范围</h3><span id="model-units">m</span></div>
            <dl class="property-list" id="model-properties"></dl>
          </section>

          <section class="panel-section selection-section">
            <div class="section-heading"><h3>选中构件</h3><span id="selection-confidence">未选择</span></div>
            <div class="selection-empty" id="selection-empty">
              <i data-lucide="mouse-pointer-2"></i><span>点击模型构件</span>
            </div>
            <dl class="property-list" id="selection-properties" hidden></dl>
          </section>
        </aside>

        <div class="privacy-note" id="privacy-note">
          <i data-lucide="shield-check"></i><span>模型仅在此浏览器中读取</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
